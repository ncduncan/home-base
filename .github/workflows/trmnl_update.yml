name: TRMNL Display Update

on:
  schedule:
    # 8:00 UTC daily = 4am EDT / 3am EST — once-a-day before-wake refresh.
    # No single cron hits 4am ET year-round (DST); we prefer the always-ready-
    # by-4am choice over the always-at-4am-or-later one.
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Manual trigger for testing

# Public repo: keep run logs clean of personal content. The agent enforces
# this in code (counts and step transitions only).

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    name: Push today's screen to TRMNL display
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push to TRMNL
        working-directory: agent/trmnl
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ASANA_WORKSPACE_GID: ${{ secrets.ASANA_WORKSPACE_GID }}
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        run: npm start
