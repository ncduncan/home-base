name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # `shared/**` is included because the web bundle imports from
    # @home-base/shared at build time, so shared changes affect the deploy.
    paths: ['web/**', 'shared/**']
  workflow_dispatch:

# Minimal permissions: read source, write to Pages via OIDC only
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deploys; cancel in-flight build if a newer push arrives
concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Informational only — never block the deploy. The flagged advisories are
      # in build-time tooling (vite/esbuild/tsx, etc.) that does NOT ship in the
      # static browser bundle, and new advisories land over time independent of
      # our code. continue-on-error keeps the report visible without gating Pages.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: web
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          # Asana now runs through the asana-ops Edge Function (PAT held
          # server-side). The PAT must NOT be bundled into the public site.

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
