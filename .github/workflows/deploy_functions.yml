name: Deploy Supabase Functions

# Keeps the deployed Edge Functions in lockstep with the repo. Edge-function
# deploys are otherwise manual (`supabase functions deploy`), which is how the
# deployed calendar-ops silently fell behind its committed source — it kept
# serving an older revision that ignored the requested week window. This
# workflow removes that drift class entirely.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Same project the web app and briefing agent target.
      PROJECT_REF: ohwzvtnpekirbpskcuvn
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploys every function under supabase/functions (calendar-ops,
      # google-token-refresh, trmnl). No config.toml is present, so verify_jwt
      # stays at the CLI default (true) — which matches the current deployed
      # state for all three. Function secrets are managed separately in Supabase
      # and are untouched by a deploy.
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
