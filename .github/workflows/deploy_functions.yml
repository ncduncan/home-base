name: Deploy Supabase Functions

# Keeps the deployed Edge Functions in lockstep with the repo. Edge-function
# deploys are otherwise manual (`supabase functions deploy`), which is how the
# deployed calendar-ops silently fell behind its committed source — it kept
# serving an older revision that ignored the requested week window. This
# workflow removes that drift class entirely.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Same project the web app and briefing agent target.
      PROJECT_REF: ohwzvtnpekirbpskcuvn
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest

      # Deploys every function under supabase/functions (calendar-ops, trmnl).
      # Per-function verify_jwt is pinned in supabase/config.toml (calendar-ops
      # true, trmnl false) so the gateway auth posture is source-controlled, not
      # left to the shifting CLI default. Function secrets are managed separately
      # in Supabase and are untouched by a deploy.
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
